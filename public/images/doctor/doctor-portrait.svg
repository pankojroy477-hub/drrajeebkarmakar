<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 620" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="doctorBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071B49" />
      <stop offset="50%" stop-color="#0f2b6b" />
      <stop offset="100%" stop-color="#1677D2" />
    </linearGradient>
    <linearGradient id="coatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAFCFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="scrubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1677D2" />
      <stop offset="100%" stop-color="#13A89E" />
    </linearGradient>
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="500" height="620" rx="24" fill="url(#doctorBg)" />

  <!-- Subtle Medical Ambient Rings -->
  <circle cx="250" cy="220" r="180" stroke="#25C5E8" stroke-opacity="0.12" stroke-width="2" stroke-dasharray="6 6" />
  <circle cx="250" cy="220" r="230" stroke="#25C5E8" stroke-opacity="0.08" stroke-width="1.5" />

  <!-- Doctor Silhouette Illustration -->
  <g transform="translate(0, 30)">
    <!-- Shoulders & Torso -->
    <path d="M70 540 C80 390, 150 330, 250 330 C350 330, 420 390, 430 540 Z" fill="#0b225c" />
    
    <!-- Doctor White Coat -->
    <path d="M90 540 C100 410, 160 350, 220 345 L180 540 Z" fill="url(#coatGrad)" />
    <path d="M410 540 C400 410, 340 350, 280 345 L320 540 Z" fill="url(#coatGrad)" />
    
    <!-- Inner Scrub / Shirt -->
    <path d="M220 345 L250 390 L280 345 L270 540 L230 540 Z" fill="url(#scrubGrad)" />
    <path d="M240 350 L250 370 L260 350 Z" fill="#ffffff" opacity="0.6" />

    <!-- Stethoscope -->
    <path d="M190 350 C185 410, 210 470, 250 475 C290 470, 315 410, 310 350" stroke="#CBD5E1" stroke-width="6" stroke-linecap="round" fill="none" />
    <circle cx="250" cy="485" r="14" fill="#25C5E8" stroke="#ffffff" stroke-width="3" filter="url(#badgeShadow)" />
    <circle cx="250" cy="485" r="5" fill="#071B49" />

    <!-- Neck -->
    <rect x="225" y="270" width="50" height="70" rx="10" fill="#E2BA98" />
    <path d="M225 315 C235 330, 265 330, 275 315 Z" fill="#D3A783" opacity="0.4" />

    <!-- Head & Hair -->
    <ellipse cx="250" cy="225" rx="55" ry="68" fill="#F0CEB0" />
    <path d="M192 215 C190 150, 230 140, 250 140 C270 140, 310 150, 308 215 C300 170, 285 160, 250 160 C215 160, 200 170, 192 215 Z" fill="#1A202C" />
    
    <!-- Ears -->
    <circle cx="193" cy="225" r="10" fill="#E2BA98" />
    <circle cx="307" cy="225" r="10" fill="#E2BA98" />

    <!-- Surgical Mask / Refined Medical Profile -->
    <path d="M205 230 C205 270, 295 270, 295 230 C295 220, 205 220, 205 230 Z" fill="#ffffff" opacity="0.95" rx="8" />
    <path d="M205 230 L195 225 M295 230 L305 225 M205 250 L195 245 M295 250 L305 245" stroke="#ffffff" stroke-width="2" />
  </g>

  <!-- Executive Doctor Badge Floating at Bottom -->
  <g transform="translate(45, 500)" filter="url(#badgeShadow)">
    <rect width="410" height="85" rx="18" fill="#071B49" stroke="#25C5E8" stroke-width="1.5" />
    <circle cx="48" cy="42" r="22" fill="#1677D2" />
    <path d="M48 30v24M36 42h24" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <text x="85" y="36" fill="#ffffff" font-family="'Inter', sans-serif" font-weight="700" font-size="16">Dr. Rajeebshankar Karmakar</text>
    <text x="85" y="58" fill="#25C5E8" font-family="'Inter', sans-serif" font-weight="600" font-size="12">Assistant Professor (Thoracic Surgery)</text>
    <text x="85" y="72" fill="#94A3B8" font-family="'Inter', sans-serif" font-weight="500" font-size="10">BMDC Reg. No: A-61665 | NIDCH, MS</text>
  </g>
</svg>
